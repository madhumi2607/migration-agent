[project]
name = "migration-agent"
version = "0.1.0"
description = "An autonomous agent that upgrades Python codebases across breaking library releases."
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    # Anthropic's official SDK: the Claude provider (default model for agent runs).
    "anthropic>=1.15,<2",
    # Vector store for docs_search (CLAUDE.md); bundles a local ONNX embedding model, so no API cost per query.
    "chromadb>=1.5,<2",
    # Dashboard backend (dashboard/api.py): JSON API over runs/ and serving the React app.
    "fastapi>=0.120,<1",
    # Google's official Gemini SDK: second LLM provider (larger free-tier token limits than Groq).
    "google-genai>=2.31,<3",
    # Groq's official SDK: the first LLM provider; its built-in retry/backoff handles 429s.
    "groq>=1.7,<2",
    # Official MCP Python SDK: used to build the repo_tools and sandbox tool servers.
    "mcp>=2.3,<3",
    # Version-range parsing for the review checks (agent/checks.py); the same library pip uses.
    "packaging>=24",
    # Reads benchmark/tasks.yaml (the task list format CLAUDE.md specifies).
    "pyyaml>=6,<7",
    # ASGI server that runs the dashboard (already pulled in by mcp; listed because we use it directly).
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

# This is an application, not a library we publish, so uv doesn't need to build
# and install it. Tests import `agent` / `mcp_servers` straight from the repo root.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tests that need Docker are slow (~30s each) and opt-in: `uv run pytest -m docker`.
markers = ["docker: needs a running Docker engine and the sandbox image"]
addopts = '-m "not docker"'
