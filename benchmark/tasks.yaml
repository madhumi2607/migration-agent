# Benchmark tasks. One entry per target repo, pinned to a commit that uses the old version.
# install:   installs the repo with its OWN dependencies (repo is the cwd). Editable (-e), so
#            tracebacks point into the repo, not site-packages. The agent controls these deps.
# test_deps: test tools and era pins (versions the repo was written against, so the baseline
#            passes). Installed separately AFTER the repo: when the agent correctly bumps a
#            dependency, a harness pin must never make its install fail (it did, see
#            fastapi-restful, and the agent hand-rolled BaseSettings to dodge the conflict).
# upgrade: pip requirement(s) forced on top to simulate the upgrade. Move companion packages
#          only as far as the new version requires, so the task stays about this library.
#
# A task is only valid if its baseline passes on the old version and its tests use the
# library through its public API: the agent may not edit tests, so tests that depend on
# old-version internals make the task impossible.
#
# Run one with:  uv run --env-file .env python -m agent.loop --task <id>

tasks:
  - id: geojson-pydantic
    difficulty: easy
    repo: https://github.com/developmentseed/geojson-pydantic
    commit: 8a07ab86373fb289c6a4ce34c2105a777debe380  # tag 0.6.3, pins pydantic~=1.0
    library: pydantic
    old_version: "1"
    new_version: "2"
    # shapely 2.0.x: the tests compare WKT strings, and 2.1+ (newer GEOS) and 1.x format them differently.
    install: pip install -e .
    test_deps: pytest "shapely>=2.0,<2.1"
    upgrade: pydantic>=2,<3
    test: pytest tests
    baseline: 134 passed on pydantic 1.10
    reference_solution: https://github.com/developmentseed/geojson-pydantic/pull/130  # upstream native v2 port

  - id: fastapi-restful
    difficulty: medium
    repo: https://github.com/yuval9313/FastApi-RESTful
    commit: 9ca60cb63e38551d54c74acd69f7469f5e9519a1  # pins pydantic ^1.0,<2.0, fastapi >=0.89,<1.0
    library: pydantic
    old_version: "1"
    new_version: "2"
    # fastapi<0.100: newer releases changed request-scoped dependency cleanup (7 unrelated failures).
    # Old httpx / pytest / pytest-asyncio: newer releases broke APIs the old test client relies on.
    install: pip install -e ".[session]"
    test_deps: '"fastapi>=0.89,<0.100" "pytest>=7,<8" "pytest-asyncio<0.24" "httpx<0.28" aiofiles'
    # Pydantic v2 needs FastAPI >=0.100; stay below 0.104 so later FastAPI changes aren't part of the task.
    # BaseSettings moved to pydantic-settings: adding that dependency is part of the agent's job.
    upgrade: pydantic>=2,<3 fastapi>=0.100,<0.104
    test: pytest tests
    baseline: 69 passed on pydantic 1.10 + fastapi 0.99
    reference_solution: https://github.com/yuval9313/FastApi-RESTful/pull/199  # keeps a v1 branch too

  - id: pydantic-cli
    difficulty: hard
    repo: https://github.com/mpkocher/pydantic-cli
    commit: d67ab8b265fd9ed045d27ecd904a04b8185481fa  # REQUIREMENTS.txt pins pydantic >=1.5,<2
    library: pydantic
    old_version: "1"
    new_version: "2"
    # shtab: optional dependency; without it 2 tests are skipped.
    install: pip install -e .
    test_deps: '"pytest>=7,<8" shtab'
    upgrade: pydantic>=2,<3
    test: pytest pydantic_cli/tests
    baseline: 35 passed on pydantic 1.10
    # Upstream changed CLI boolean-flag behaviour in its v2 port and rewrote those tests, so there is
    # no drop-in reference for them: the agent must keep v1 CLI behaviour on top of v2 introspection.
    reference_solution: https://github.com/mpkocher/pydantic-cli/pull/58

# Rejected tasks, kept so they aren't re-evaluated.
rejected:
  - id: pydantic-argparse
    repo: https://github.com/SupImDos/pydantic-argparse
    commit: c07199879040f9cfd26f13b2cfbeb8105a3c830f  # tag v0.8.0
    reason: >-
      Tests depend on Pydantic v1 internals (tests/conftest.py uses pydantic.fields.ModelField.infer
      and pydantic.BaseSettings; test_parser.py uses __fields__, outer_type_, field_info), so the suite
      cannot pass under v2 without editing tests. Upstream only moved to the pydantic.v1 shim.
